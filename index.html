<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHOP</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
.header{background:#131921;color:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:999}
.logo{font-weight:900;font-size:18px}
.searchCenter{flex:1;max-width:520px;margin:0 auto;position:relative}
.searchBox{background:#fff;border-radius:24px;display:flex;align-items:center;padding:4px 5px 4px 15px;width:100%;box-sizing:border-box}
.searchBox input{flex:1;border:none;outline:none;padding:8px 6px;font-size:14px}
.searchBox button{background:#febd69;border:none;min-width:42px;height:34px;border-radius:20px;cursor:pointer}
#suggestBox{position:absolute;left:0;right:0;top:44px;background:#fff;color:#111;border-radius:0 0 12px 12px;box-shadow:0 6px 15px rgba(0,0,0,.25);display:none;z-index:1000;max-height:320px;overflow:auto}
.sug{padding:11px 14px;font-size:13px;border-bottom:1px solid #eee;cursor:pointer;display:flex;gap:8px}
.sug:hover{background:#f5f5f5}
.card{background:#fff;border-radius:8px;border:1px solid #e3e3e3;overflow:hidden;cursor:pointer;position:relative}
.thumb-wrap{height:170px;display:flex;align-items:center;justify-content:center;background:#fff;padding:8px}
.price-old{font-size:11px;color:#888;text-decoration:line-through;margin-left:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div class="header">
<div class="logo">SHOP</div>

<div class="searchCenter">
<div class="searchBox">
<input id="searchInput" placeholder="Buscar por nombre..." oninput="buscarGoogle(this.value)" autocomplete="off">
<button onclick="buscarGoogle(document.getElementById('searchInput').value)">🔍</button>
</div>
<div id="suggestBox"></div>
</div>

<div onclick="openCart()" style="background:#fff;color:#111;padding:6px 14px;border-radius:18px;font-weight:900;font-size:12px;cursor:pointer;white-space:nowrap">🛒 <span id="cartCount">0</span></div>
</div>

<div id="mainShop" style="max-width:1200px;margin:auto;padding:12px">
<div id="viewCats"></div>
<div id="viewProd" style="display:none">
<h2 id="catName" style="font-size:15px"></h2>
<div id="prod" class="grid"></div>
</div>
<div id="viewDetail" style="display:none"></div>
</div>

<script>
// TUS PRODUCTOS - AQUI SE CONECTA CON TU SHEET, DEJALO ASI COMO ESTABA
let productos = [
{nombre:"Audifonos Bluetooth P9", categoria:"Tecnologia", usd:12, specs:"Sonido estereo", fotos:["https://i.ibb.co/placeholder.jpg"]},
{nombre:"Organizador de Cables", categoria:"Hogar", usd:5, specs:"Para escritorio", fotos:["https://i.ibb.co/placeholder.jpg"]},
{nombre:"Soporte Celular Auto", categoria:"Auto", usd:8, specs:"Gira 360", fotos:["https://i.ibb.co/placeholder.jpg"]},
{nombre:"Tira LED RGB", categoria:"Hogar", usd:9, specs:"5 metros", fotos:["https://i.ibb.co/placeholder.jpg"]},
{nombre:"Mini Ventilador", categoria:"Tecnologia", usd:6, specs:"Recargable", fotos:["https://i.ibb.co/placeholder.jpg"]}
];

function fmt(usd){return '$'+(usd*4200).toLocaleString('es-CO')}
function getDiscountForProduct(i){return 35+(i%25)}
function getVisualOldPrice(usd,off){return usd/(1-off/100)}
function thumb(u){return u}
let cart=[];

function showCats(){
document.getElementById('viewCats').style.display='block';
document.getElementById('viewProd').style.display='none';
document.getElementById('viewDetail').style.display='none';
let cats=[...new Set(productos.map(p=>p.categoria))];
let h='<div class="grid">';
cats.forEach(c=>{h+=`<div class="card" onclick="openCat('${c}')" style="padding:28px;text-align:center;font-weight:800">${c}</div>`});
h+=`</div><br><button onclick="openAllProducts()" style="width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:24px;font-weight:800">Ver todos los productos - Envio gratis</button>`;
document.getElementById('viewCats').innerHTML=h;
}
function openCat(cat){
document.getElementById('viewCats').style.display='none';
document.getElementById('viewProd').style.display='block';
document.getElementById('viewDetail').style.display='none';
document.getElementById('catName').innerText=cat+' • Click para ver pagina';
renderProds(productos.filter(p=>p.categoria==cat));
}
function openAllProducts(){
document.getElementById('viewCats').style.display='none';
document.getElementById('viewProd').style.display='block';
document.getElementById('viewDetail').style.display='none';
document.getElementById('catName').innerText='Todos los productos • Envio gratis';
renderProds(productos);
}
function renderProds(lista){
let h='';
productos.forEach((p,idx)=>{
if(!lista.includes(p)) return;
let off=getDiscountForProduct(idx);let oldP=getVisualOldPrice(p.usd,off);
h+=`<div onclick="openDetail(${idx})" class="card"><div style="position:absolute;top:6px;left:6px;background:#111;color:#fff;font-size:10px;padding:3px 6px;border-radius:10px">-${off}%</div><div class="thumb-wrap"><img src="${p.fotos[0]}" style="max-width:100%;max-height:100%"></div><div style="padding:10px"><b style="font-size:12px">${p.nombre}</b><div style="font-weight:800">${fmt(p.usd)}<span class="price-old">${fmt(oldP)}</span></div><div style="font-size:10px;color:#0a7a0a">Envio gratis</div></div></div>`;
});
document.getElementById('prod').innerHTML=h;
}
function openDetail(i){
let p=productos[i];
document.getElementById('viewProd').style.display='none';
document.getElementById('viewCats').style.display='none';
document.getElementById('viewDetail').style.display='block';
document.getElementById('viewDetail').innerHTML=`<div style="background:#fff;padding:14px;border-radius:12px"><button onclick="showCats()" style="border:none;background:#eee;padding:8px 12px;border-radius:18px">← Volver</button><h2>${p.nombre}</h2><div style="height:280px;display:flex;justify-content:center;align-items:center"><img src="${p.fotos[0]}" style="max-width:100%;max-height:100%"></div><div style="font-size:22px;font-weight:900">${fmt(p.usd)}</div><p style="font-size:13px">${p.specs}</p><button onclick="addToCart(${i})" style="width:100%;padding:14px;background:#ffd814;border:none;border-radius:24px;font-weight:900">Agregar al carrito</button></div>`;
}
function addToCart(i){cart.push(productos[i]);document.getElementById('cartCount').innerText=cart.length;alert('Agregado: '+productos[i].nombre)}
function openCart(){alert('Carrito '+cart.length+'\n'+cart.map(p=>p.nombre).join('\n'))}

// BUSCADOR EN EL CENTRO ARRIBA CON LUPA - SOLO NOMBRE TIPO GOOGLE
function buscarGoogle(q){
let texto=q.toLowerCase().trim();
let box=document.getElementById('suggestBox');
if(!texto){box.style.display='none';return;}
let filtrados=productos.filter(p=>p.nombre.toLowerCase().includes(texto));
let html='';
filtrados.slice(0,8).forEach(p=>{
let safe=p.nombre.replace(/'/g,"\\'");
html+=`<div class="sug" onclick="selectSearch('${safe}')"><span>🔍</span> ${p.nombre}</div>`;
});
if(filtrados.length==0) html=`<div class="sug">No hay resultados para "${q}"</div>`;
box.innerHTML=html;
box.style.display='block';
if(texto.length>=1){
document.getElementById('viewCats').style.display='none';
document.getElementById('viewDetail').style.display='none';
document.getElementById('viewProd').style.display='block';
document.getElementById('catName').innerText=`Busqueda: "${q}" • ${filtrados.length} resultados`;
renderProds(filtrados);
}
}
function selectSearch(nombre){
document.getElementById('searchInput').value=nombre;
document.getElementById('suggestBox').style.display='none';
buscarGoogle(nombre);
}
document.addEventListener('click',e=>{
if(!e.target.closest('.searchCenter')) document.getElementById('suggestBox').style.display='none';
});
showCats();
</script>
</body>
</html>
