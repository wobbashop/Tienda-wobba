<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WobbaShop</title></head><body style="margin:0;font-family:sans-serif;background:#f5f5f5"><div style="max-width:480px;margin:auto;background:white;min-height:100vh"><header style="background:black;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10"><div id="headTitle"><b>WOBBASHOP</b><div style="font-size:11px;opacity:.7">Categorías</div></div><button onclick="toggle()" style="background:white;color:black;width:44px;height:44px;border-radius:50%;font-weight:900;position:relative">🛒<span id="n" style="position:absolute;top:-5px;right:-5px;background:black;color:white;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white">0</span></button></header><div id="viewCat" style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px"></div><div id="viewProd" style="display:none;padding:16px"><button onclick="showCats()" style="background:white;border:1px solid #ddd;padding:8px 14px;border-radius:20px;margin-bottom:12px">← Volver</button><h2 id="catName" style="margin:0 0 12px 0;font-size:22px"></h2><div id="prod" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div></div><div id="cart" style="position:fixed;top:0;right:-100%;width:100%;max-width:480px;height:100%;background:white;z-index:99;transition:.3s;display:flex;flex-direction:column"><div style="background:black;color:white;padding:16px;display:flex;justify-content:space-between"><b>CARRITO</b><button onclick="toggle()" style="background:white;color:black;width:28px;height:28px;border-radius:50%">X</button></div><div id="list" style="flex:1;overflow:auto;padding:12px"></div><div style="padding:12px;border-top:1px solid #ddd"><b>Total: $<span id="t">0</span></b><div style="background:#f5f5f5;border:1px solid #ddd;padding:10px;border-radius:12px;margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>Nequi 3016202301</span><button onclick="navigator.clipboard.writeText('3016202301');alert('Copiado')" style="background:white;border:1px solid #ddd;padding:4px 10px;border-radius:20px">Copiar</button></div><button onclick="pay()" style="background:black;color:white;width:100%;padding:13px;border-radius:24px;font-weight:700;margin-top:10px">Enviar comprobante por WhatsApp →</button></div></div></div><div id="bg" onclick="toggle()" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;z-index:90"></div></div></div><script>
let productos=[
  {nombre:"Gorra Negra",precio:45000,foto:"🧢",categoria:"Gorras"},
  {nombre:"Gorra Azul",precio:40000,foto:"🧢",categoria:"Gorras"},
  {nombre:"Hoodie Negro",precio:89000,foto:"👕",categoria:"Hoodies"},
  {nombre:"Hoodie Blanco",precio:89000,foto:"👕",categoria:"Hoodies"},
  {nombre:"Tenis Wobba",precio:120000,foto:"👟",categoria:"Tenis"},
  {nombre:"Bolso Cuero",precio:65000,foto:"👜",categoria:"Bolsos"},
];
let c=[],open=false;
const catIcons={"gorras":"🧢","hoodies":"👕","tenis":"👟","bolsos":"👜","default":"🛍️"};
function iconFor(cat){let k=cat.toLowerCase();for(let i in catIcons){if(k.includes(i))return catIcons[i];}return catIcons.default;}
function showCats(){let cats=[...new Set(productos.map(p=>p.categoria))];let h='';for(let cat of cats){let count=productos.filter(p=>p.categoria==cat).length;h+=`<div onclick="openCat('${cat}')" style="background:white;border:1px solid #e5e5e5;border-radius:16px;padding:20px 12px;text-align:center;cursor:pointer"><div style="font-size:40px">${iconFor(cat)}</div><b style="display:block;margin-top:8px;font-size:14px">${cat}</b><span style="font-size:12px;color:#888">${count} productos</span></div>`;}document.getElementById('viewCat').innerHTML=h;document.getElementById('viewCat').style.display='grid';document.getElementById('viewProd').style.display='none';document.getElementById('headTitle').innerHTML='<b>WOBBASHOP</b><div style="font-size:11px;opacity:.7">Categorías</div>';}
function openCat(cat){document.getElementById('viewCat').style.display='none';document.getElementById('viewProd').style.display='block';document.getElementById('catName').innerText=cat;document.getElementById('headTitle').innerHTML=`<b onclick="showCats()" style="cursor:pointer">← ${cat}</b>`;let h='';for(let i=0;i<productos.length;i++){let p=productos[i];if(p.categoria!=cat)continue;h+=`<div style="border:1px solid #e5e5e5;border-radius:12px;padding:12px;text-align:center;background:white"><div style="font-size:36px">${p.foto}</div><b style="font-size:13px;display:block;margin-top:6px">${p.nombre}</b><span style="font-weight:900">$${p.precio.toLocaleString()}</span><br><button onclick="add(${i})" style="background:black;color:white;width:100%;padding:8px;border-radius:20px;margin-top:6px;font-size:13px">Agregar</button></div>`;}document.getElementById('prod').innerHTML=h;}
function add(i){let p=productos[i];c.push({n:p.nombre,p:p.precio,i:Date.now()});upd();if(!open)toggle();}
function del(i){c=c.filter(x=>x.i!=i);upd();}
function upd(){let s=0;for(let x of c)s+=x.p;document.getElementById('n').innerText=c.length;document.getElementById('t').innerText=s.toLocaleString();let h='';if(!c.length)h='<p style=text-align:center;color:#999;margin-top:30px>Vacio</p>';else for(let x of c)h+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0"><span>${x.n} $${x.p.toLocaleString()}</span><button onclick="del(${x.i})" style="background:#f5f5f5;border:1px solid #ddd;width:26px;height:26px;border-radius:50%">x</button></div>`;document.getElementById('list').innerHTML=h;}
function toggle(){open=!open;document.getElementById('cart').style.right=open?'0':'-100%';document.getElementById('bg').style.display=open?'block':'none';}
function pay(){if(!c.length){alert('Agrega algo');return;}let s=0,m='';for(let x of c){s+=x.p;m+=x.n+', ';}window.open('https://wa.me/573016202301?text='+encodeURIComponent('Hola WobbaShop! Pague $'+s+' a Nequi 3016202301 Productos: '+m),'_blank');}
showCats();upd();
</script></body></html>
